<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOS Alert</title>
<style>
  :root { --card:#1f6f68; --ink:#eafffb; --accent:#5eead4; --danger:#ef4444; }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; font-family: system-ui, sans-serif; color:var(--ink);
         background: linear-gradient(160deg,#3a0a14,#1b0509); min-height:100vh; }
  .wrap { max-width:560px; margin:0 auto; display:grid; gap:14px; }
  .card { background:var(--card); border-radius:18px; padding:16px; }
  h3 { margin:0 0 8px; color:var(--accent); font-size:15px; }
  #loc { font-size:13px; opacity:.85; }
  #sos { width:100%; padding:22px; font-size:22px; font-weight:800; border:0; border-radius:18px;
         background:var(--danger); color:#fff; cursor:pointer; }
  #sos:disabled { opacity:.6; }
  pre { margin:0; background:#0b1c1c; border-radius:12px; padding:12px; white-space:pre-wrap;
        word-break:break-word; font-size:13px; }
  input, textarea { width:100%; padding:10px; border-radius:10px; border:0; margin-top:6px; font-size:15px; }
  .row { display:flex; gap:8px; align-items:center; justify-content:space-between; margin-top:8px; flex-wrap:wrap; }
  button.s { padding:10px 14px; border:0; border-radius:10px; background:var(--accent); color:#04332e;
             font-weight:700; cursor:pointer; }
  button.g, a.g { padding:10px 14px; border:1px solid var(--accent); border-radius:10px; background:transparent;
             color:var(--ink); cursor:pointer; text-decoration:none; font-size:14px; }
  .ok { color:#bbf7d0; } .bad { color:#fecaca; }
  .contact { padding:8px 0; border-top:1px solid rgba(255,255,255,.12); font-size:14px; }
  .contact small { display:block; opacity:.8; }
  .contact a.rm { color:var(--accent); float:right; }
  .chat { display:inline-block; margin:4px 4px 0 0; }
  details summary { cursor:pointer; color:var(--accent); font-size:14px; }
</style>
</head>
<body>
<div class="wrap">
  <div id="loc">Getting location...</div>

  <button id="sos">SEND SOS NOW</button>

  <div class="card">
    <h3>Status</h3>
    <div id="status">Ready. Press SOS to send automatically (Telegram + WhatsApp).</div>
  </div>

  <div class="card">
    <h3>Message</h3>
    <pre id="msg">-</pre>
    <div class="row">
      <button class="s" id="share">Share...</button>
      <button class="g" id="copy">Copy</button>
    </div>
    <div class="row" id="backup"></div>
  </div>

  <div class="card">
    <h3>Your contacts</h3>
    <div id="list"></div>
    <details>
      <summary>Add contact</summary>
      <input id="name" placeholder="Name">
      <input id="phone" placeholder="Mobile number (10 digit)" inputmode="tel">
      <input id="tgid" placeholder="Telegram chat id (optional, use Find below)" inputmode="numeric">
      <input id="cmb" placeholder="CallMeBot WhatsApp key (optional)">
      <div class="row">
        <button class="s" id="add">Add contact</button>
        <button class="g" id="find">Find Telegram contacts</button>
      </div>
      <div id="chats"></div>
    </details>
  </div>

  <div class="card">
    <h3>Optional note</h3>
    <textarea id="note" rows="2" placeholder="e.g. I am being followed"></textarea>
  </div>
</div>

<script>
// If this page is on GitHub Pages, put your deployed backend URL here, e.g. "https://your-app.onrender.com"
const API_BASE = "";

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let pos = null;
let contacts = [];
let liveTargets = [];
let liveTimer = null;
try { contacts = JSON.parse(localStorage.getItem("sos_contacts") || "[]"); } catch {}

function save() { try { localStorage.setItem("sos_contacts", JSON.stringify(contacts)); } catch {} }
function digits(n) { let d = String(n).replace(/\D/g, ""); if (d.length > 10) d = d.slice(-10); return d; }

function renderContacts() {
  $("list").innerHTML = "";
  contacts.forEach((c, i) => {
    const row = document.createElement("div");
    row.className = "contact";
    const ch = [c.telegramChatId ? "Telegram" : "", c.callmebotKey ? "WhatsApp" : ""].filter(Boolean).join(" + ") || "no auto channel";
    row.innerHTML = `<a href="#" class="rm">remove</a>${esc(c.name)} ${c.phone ? "(" + esc(c.phone) + ")" : ""}<small>${ch}</small>`;
    row.querySelector("a").onclick = (e) => { e.preventDefault(); contacts.splice(i, 1); save(); renderContacts(); };
    $("list").appendChild(row);
  });
}

function buildMessage() {
  if (!pos) return "-";
  const link = `https://maps.google.com/?q=${pos.lat.toFixed(6)},${pos.lng.toFixed(6)}`;
  return `EMERGENCY. I need help.\nMy live location: ${link}\nTime: ${new Date().toLocaleString("en-IN")}\nPlease contact me or call the police on 112.`;
}

function renderBackup() {
  const text = encodeURIComponent($("msg").textContent);
  $("backup").innerHTML = "";
  contacts.filter((c) => c.phone).forEach((c) => {
    const sms = document.createElement("a");
    sms.className = "g"; sms.href = `sms:+91${c.phone}?body=${text}`; sms.textContent = "SMS " + c.name;
    const wa = document.createElement("a");
    wa.className = "g"; wa.target = "_blank"; wa.rel = "noopener";
    wa.href = `https://wa.me/91${c.phone}?text=${text}`; wa.textContent = "WhatsApp " + c.name;
    $("backup").append(sms, wa);
  });
}

if ("geolocation" in navigator) {
  navigator.geolocation.watchPosition(
    (p) => {
      pos = { lat: p.coords.latitude, lng: p.coords.longitude, accuracy: p.coords.accuracy };
      $("loc").textContent = `Live location on. Accuracy about ${Math.round(pos.accuracy)} m.`;
      if (!liveTargets.length) { $("msg").textContent = buildMessage(); renderBackup(); }
    },
    (e) => { $("loc").textContent = "Location error: " + e.message; },
    { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 }
  );
} else {
  $("loc").textContent = "Location not supported on this device.";
}

$("add").onclick = () => {
  const name = $("name").value.trim() || "Contact";
  const phone = $("phone").value.trim() ? digits($("phone").value) : "";
  const telegramChatId = $("tgid").value.trim();
  const callmebotKey = $("cmb").value.trim();
  if (phone && phone.length !== 10) return alert("Enter a valid 10 digit number");
  if (!phone && !telegramChatId) return alert("Add a phone number or a Telegram chat id");
  contacts.push({ name, phone, telegramChatId, callmebotKey });
  save(); renderContacts(); renderBackup();
  ["name", "phone", "tgid", "cmb"].forEach((id) => ($(id).value = ""));
};

$("find").onclick = async () => {
  $("chats").textContent = "Searching...";
  try {
    const r = await fetch(API_BASE + "/api/telegram/chats");
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "Error " + r.status);
    if (!d.chats.length) { $("chats").textContent = "Nobody yet. Ask contacts to open your bot and press Start."; return; }
    $("chats").innerHTML = "";
    d.chats.forEach((c) => {
      const b = document.createElement("button");
      b.className = "g chat"; b.textContent = `${c.name} (${c.chatId})`;
      b.onclick = () => { $("tgid").value = c.chatId; if (!$("name").value) $("name").value = c.name; };
      $("chats").appendChild(b);
    });
  } catch (e) { $("chats").textContent = "Failed: " + e.message; }
};

function startLiveUpdates() {
  clearInterval(liveTimer);
  if (!liveTargets.length) return;
  liveTimer = setInterval(() => {
    if (!pos) return;
    fetch(API_BASE + "/api/update", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ targets: liveTargets, lat: pos.lat, lng: pos.lng }),
    }).catch(() => {});
  }, 15000);
}

$("sos").onclick = async () => {
  if (!pos) return ($("status").textContent = "Location not ready yet. Wait a few seconds.");
  if (!contacts.length) return ($("status").textContent = "Add at least one contact first.");

  $("sos").disabled = true;
  $("status").textContent = "Sending...";
  try {
    const r = await fetch(API_BASE + "/api/sos", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ contacts, lat: pos.lat, lng: pos.lng, accuracy: pos.accuracy, note: $("note").value.trim() }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "Server error " + r.status);

    $("msg").textContent = d.message; renderBackup();
    const line = (label, arr) => {
      if (!arr.length) return "";
      const good = arr.filter((x) => x.ok).length;
      const bad = arr.find((x) => !x.ok);
      return `<div class="${bad ? "bad" : "ok"}">${label}: ${good}/${arr.length} sent${bad ? " (" + esc(bad.error) + ")" : ""}</div>`;
    };
    let html = line("Telegram", d.telegram) + line("WhatsApp", d.whatsapp);
    if (d.sms && !d.sms.skipped) html += `<div class="${d.sms.ok ? "ok" : "bad"}">SMS: ${d.sms.ok ? "sent" : esc(d.sms.error)}</div>`;
    if (!html) html = `<div class="bad">No contact has Telegram or WhatsApp set up. Use the SMS / WhatsApp buttons below, or call 112.</div>`;
    const failed = d.telegram.some((x) => !x.ok) || d.whatsapp.some((x) => !x.ok);
    if (failed) html += `<div>Use the SMS / WhatsApp buttons below as backup, or call 112.</div>`;
    $("status").innerHTML = html;

    liveTargets = d.telegram.filter((x) => x.ok).map((x) => ({ chatId: x.chatId, messageId: x.messageId }));
    startLiveUpdates();
  } catch (e) {
    $("status").innerHTML = `<div class="bad">Could not send automatically (${esc(e.message)}). Use the SMS / WhatsApp buttons below or call 112.</div>`;
  } finally {
    $("sos").disabled = false;
  }
};

$("copy").onclick = async () => {
  try { await navigator.clipboard.writeText($("msg").textContent); $("status").textContent = "Copied."; } catch {}
};
$("share").onclick = async () => {
  const text = $("msg").textContent;
  if (navigator.share) { try { await navigator.share({ text }); } catch {} }
  else { try { await navigator.clipboard.writeText(text); $("status").textContent = "Copied."; } catch {} }
};

renderContacts();
</script>
</body>
</html>
