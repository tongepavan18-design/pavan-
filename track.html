<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sakhi live location</title>
<style>
body{margin:0;background:#0F2128;color:#E6F0F2;font:17px/1.45 system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:18px}
h1{margin:0 0 4px;font-size:24px;color:#FF8A98}
.s{color:#9FB5BC;font-size:14px;margin:4px 0 12px}
iframe{width:100%;height:55vh;min-height:300px;border:0;border-radius:14px;background:#17353C}
.card{background:#17353C;border-radius:14px;padding:14px;margin-top:12px}
a.btn{display:inline-block;margin-top:8px;background:#4FD1C5;color:#06262A;font-weight:600;padding:12px 16px;border-radius:12px;text-decoration:none}
.safe{color:#4FD1C5}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">Live location</h1>
  <div class="s" id="sub">Loading...</div>
  <iframe id="map" title="Map" loading="lazy"></iframe>
  <div class="card"><div id="info">Waiting for location...</div><a class="btn" id="gm" href="#" target="_blank" rel="noopener" style="display:none">Open in Google Maps</a></div>
  <p class="s">If you cannot reach this person, call the police on 112.</p>
</div>
<script>
const id = location.pathname.split('/').pop();
let last = null;
function ago(ms) { const s = Math.round(ms / 1000); return s < 60 ? s + ' sec ago' : Math.round(s / 60) + ' min ago' }
async function poll() {
  try {
    const r = await fetch('/api/loc/' + id, { cache: 'no-store' });
    if (!r.ok) { document.getElementById('sub').textContent = 'This link has expired.'; return }
    const d = await r.json();
    const t = document.getElementById('title');
    if (!d.active) { t.textContent = 'Sharing stopped'; t.className = 'safe'; document.getElementById('sub').textContent = 'The person marked themselves safe.' }
    else { t.textContent = 'Emergency: live location'; document.getElementById('sub').textContent = 'Updates every few seconds. ' + (d.note || '') }
    if (d.pos) {
      const { lat, lng, acc } = d.pos;
      if (!last || Math.abs(last.lat - lat) > 0.0001 || Math.abs(last.lng - lng) > 0.0001) {
        last = d.pos;
        document.getElementById('map').src = `https://www.openstreetmap.org/export/embed.html?bbox=${lng - 0.004},${lat - 0.0025},${lng + 0.004},${lat + 0.0025}&layer=mapnik&marker=${lat},${lng}`;
      }
      document.getElementById('info').textContent = `Lat ${lat.toFixed(5)}, Lng ${lng.toFixed(5)}. Accuracy about ${acc} m. Updated ${ago(Date.now() - d.at)}.`;
      const g = document.getElementById('gm'); g.href = `https://maps.google.com/?q=${lat},${lng}`; g.style.display = '';
    } else document.getElementById('info').textContent = 'Location not received yet.';
    if (d.active) setTimeout(poll, 5000);
  } catch (e) { setTimeout(poll, 8000) }
}
poll();
</script>
</body>
</html>
